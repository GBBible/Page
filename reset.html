<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get('oobCode');
    if (oobCode) {
      // Open your app using custom scheme
      window.location.href = `myapp://reset?oobCode=${oobCode}`;
    } else {
      document.body.innerText = "Invalid reset link!";
    }
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
